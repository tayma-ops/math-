
<!-- ====================================== -->
<!-- HEADER - متجر قطع غيار السيارات -->
<!-- متوافق مع الكمبيوتر والجوال -->
<!-- ====================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
    --blue: #123c78;
    --blue-dark: #091d3c;
    --red: #d62828;
    --red-hover: #af1b1b;
    --light: #f3f6fb;
    --white: #ffffff;
    --font-ar: 'Cairo', Tahoma, Arial, sans-serif;
}

.site-header,
.site-header * {
    box-sizing: border-box;
}

.site-header {
    position: relative;
    z-index: 1000;
    font-family: var(--font-ar);
    direction: rtl;
}

/* ========== الشريط العلوي ========== */

.site-header .top-strip {
    background: linear-gradient(
        120deg,
        #091d3c,
        #123c78
    );
    color: white;
    padding: 12px 5%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    border-bottom: 2px solid var(--red);
}

.site-header .top-strip-logo {
    width: 88px;
    height: 88px;
    flex-shrink: 0;
    border-radius: 50%;
    background: white;
    padding: 7px;
    border: 3px solid var(--red);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    box-shadow:
        0 0 0 4px rgba(255,255,255,.12),
        0 6px 20px rgba(0,0,0,.3);
    transition: .3s;
}

.site-header .top-strip-logo:hover {
    transform: scale(1.06);
}

.site-header .top-strip-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 50%;
    display: block;
}

.site-header .top-strip-text {
    text-align: right;
}

.site-header .top-strip-title {
    color: white;
    font-size: 20px;
    font-weight: 900;
    margin: 0;
    line-height: 1.6;
}

.site-header .top-strip-title span {
    color: #ff7777;
}

.site-header .top-strip-subtitle {
    color: #e2e9f5;
    font-size: 13px;
    font-weight: 600;
    margin: 2px 0 0;
}

/* ========== الهيدر الرئيسي ========== */

.site-header .header-main {
    background: linear-gradient(
        120deg,
        var(--blue),
        var(--blue-dark)
    );
    padding: 20px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
}

.site-header .store-logo {
    font-size: 23px;
    font-weight: 900;
    color: white;
    text-decoration: none;
    white-space: nowrap;
}

.site-header .store-logo span {
    color: #ff7474;
}

/* ========== البحث ========== */

.site-header .header-search {
    display: flex;
    flex: 1;
    max-width: 540px;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.site-header .header-search input {
    flex: 1;
    min-width: 0;
    padding: 13px 17px;
    border: none;
    outline: none;
    font-size: 14px;
    color: var(--blue-dark);
    background: transparent;
    font-family: var(--font-ar);
}

.site-header .header-search input::placeholder {
    color: #8390a4;
}

.site-header .header-search button {
    background: var(--red);
    color: white;
    border: 0;
    padding: 0 26px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    font-family: var(--font-ar);
    transition: .3s;
}

.site-header .header-search button:hover {
    background: var(--red-hover);
}

/* ========== المنتجات والسلة ========== */

.site-header .header-actions {
    display: flex;
    gap: 20px;
    align-items: center;
}

.site-header .header-actions a {
    color: white;
    text-decoration: none;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    transition: .3s;
}

.site-header .header-actions a:hover {
    color: #ff8b8b;
}

.site-header .cart-number {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--red);
    border-radius: 50%;
    min-width: 26px;
    height: 26px;
    padding: 0 5px;
    color: white;
    font-size: 12px;
    font-weight: 800;
}

/* ========== قائمة الكمبيوتر ========== */

.site-header .nav-menu {
    background: white;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 35px;
    justify-content: center;
    padding: 14px 20px;
    border-bottom: 3px solid var(--red);
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.site-header .nav-menu a {
    color: var(--blue);
    text-decoration: none;
    font-size: 14px;
    font-weight: 800;
    position: relative;
    transition: .3s;
}

.site-header .nav-menu a::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: -6px;
    width: 0;
    height: 2px;
    background: var(--red);
    transition: width .3s;
}

.site-header .nav-menu a:hover {
    color: var(--red);
}

.site-header .nav-menu a:hover::after {
    width: 100%;
}

/* ========== زر البرجر ========== */
.site-header .nav-menu .contact-link {
    background: var(--red);
    color: white;
    padding: 8px 22px;
    border-radius: 8px;
}

.site-header .nav-menu .contact-link:hover {
    color: white;
    background: var(--red-hover);
}

.site-header .nav-menu .contact-link::after { display: none; }

.site-header a[aria-current="page"] { font-weight: 900; }

.site-header .menu-toggle {
    display: none;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    background: var(--red);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 9px;
    cursor: pointer;
    flex-shrink: 0;
    transition: .3s;
}

.site-header .menu-toggle:hover {
    background: var(--red-hover);
}

.site-header .burger-lines {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
}

.site-header .burger-lines span {
    display: block;
    width: 23px;
    height: 3px;
    background: white;
    border-radius: 5px;
    transition: .3s;
}

.site-header .menu-toggle.active .burger-lines span:first-child {
    transform: translateY(8px) rotate(45deg);
}

.site-header .menu-toggle.active .burger-lines span:nth-child(2) {
    opacity: 0;
}

.site-header .menu-toggle.active .burger-lines span:last-child {
    transform: translateY(-8px) rotate(-45deg);
}

/* ========== القائمة الجانبية للجوال ========== */

.site-header .mobile-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    z-index: 1998;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .3s, visibility .3s;
}

.site-header .mobile-overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.site-header .mobile-sidebar {
    position: fixed;
    top: 0;
    right: 0;
    width: min(330px, 85vw);
    height: 100vh;
    height: 100dvh;
    background: linear-gradient(
        160deg,
        #091d3c,
        #123c78
    );
    z-index: 1999;
    transform: translateX(105%);
    transition: transform .35s ease;
    box-shadow: -8px 0 30px rgba(0,0,0,.3);
    overflow-y: auto;
    visibility: hidden;
    direction: rtl;
}

.site-header .mobile-sidebar.open {
    transform: translateX(0);
    visibility: visible;
}

.site-header .sidebar-header {
    padding: 25px 20px;
    background: rgba(0,0,0,.15);
    border-bottom: 2px solid var(--red);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.site-header .sidebar-title {
    font-size: 17px;
    font-weight: 900;
    color: white;
}

.site-header .sidebar-title span {
    color: #ff7777;
}

.site-header .sidebar-close {
    background: var(--red);
    color: white;
    border: 0;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    font-size: 26px;
    cursor: pointer;
}

.site-header .mobile-nav {
    display: flex;
    flex-direction: column;
    padding: 20px 15px;
    gap: 7px;
}

.site-header .mobile-nav a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    color: white;
    text-decoration: none;
    padding: 15px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 700;
    background: rgba(255,255,255,.05);
    transition: .3s;
}

.site-header .mobile-nav a:hover,
.site-header .mobile-nav a:focus-visible {
    background: var(--red);
    padding-right: 23px;
}

.site-header .mobile-nav a::after {
    content: "‹";
    font-size: 23px;
}

.site-header .sidebar-bottom {
    margin: 10px 20px 25px;
    padding: 18px;
    background: rgba(255,255,255,.07);
    border-radius: 10px;
    text-align: center;
    color: #e2e9f5;
    font-size: 12px;
}

.site-header .sidebar-bottom p {
    margin: 0;
}

/* ========== التركيز ولوحة المفاتيح ========== */

.site-header a:focus-visible,
.site-header button:focus-visible,
.site-header input:focus-visible {
    outline: 3px solid #ff9999;
    outline-offset: 3px;
}

/* ========== الأجهزة اللوحية ========== */

@media (max-width: 900px) {

    .site-header .header-main {
        flex-wrap: wrap;
        padding: 16px 5%;
        gap: 15px;
    }

    .site-header .store-logo {
        font-size: 19px;
    }

    .site-header .header-search {
        order: 3;
        flex-basis: 100%;
        max-width: 100%;
    }

    .site-header .header-actions {
        gap: 12px;
        margin-right: auto;
    }

    .site-header .header-actions a {
        font-size: 12px;
    }

    .site-header .menu-toggle {
        display: inline-flex;
        order: -1;
    }

    .site-header .nav-menu {
        display: none;
    }
}

/* ========== الهواتف ========== */

@media (max-width: 600px) {

    .site-header .top-strip {
        padding: 11px 12px;
        gap: 12px;
    }

    .site-header .top-strip-logo {
        width: 64px;
        height: 64px;
        padding: 5px;
    }

    .site-header .top-strip-title {
        font-size: 14px;
    }

    .site-header .top-strip-subtitle {
        font-size: 10px;
    }

    .site-header .header-main {
        display: grid;
        grid-template-columns: 44px minmax(0,1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 14px 4%;
    }

    .site-header .menu-toggle {
        grid-column: 1;
        grid-row: 1;
        order: initial;
    }

    .site-header .store-logo {
        grid-column: 2;
        grid-row: 1;
        font-size: 13px;
        white-space: normal;
        line-height: 1.5;
    }

    .site-header .header-actions {
        grid-column: 3;
        grid-row: 1;
        margin: 0;
        gap: 7px;
    }

    .site-header .header-actions .products-link {
        display: none;
    }

    .site-header .header-actions a {
        font-size: 11px;
    }

    .site-header .cart-number {
        min-width: 22px;
        height: 22px;
        font-size: 11px;
    }

    .site-header .header-search {
        grid-column: 1 / -1;
        grid-row: 2;
        width: 100%;
        max-width: 100%;
        margin-top: 3px;
    }

    .site-header .header-search input {
        padding: 12px;
        font-size: 13px;
    }

    .site-header .header-search button {
        padding: 0 18px;
        font-size: 13px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .site-header *,
    .site-header *::before,
    .site-header *::after {
        transition-duration: .01ms !important;
    }
}
</style>


<!-- ====================================== -->
<!-- HTML -->
<!-- ====================================== -->

<header class="site-header" id="siteHeader">

    <!-- الشريط العلوي والشعار -->

    <div class="top-strip">

        <a href="index.html#home"
           class="top-strip-logo"
           aria-label="العودة إلى الرئيسية">

            <img
                src="media/ddf.png"
                alt="شعار متجر قطع غيار السيارات"
                width="72"
                height="72">

        </a>

        <div class="top-strip-text">

            <p class="top-strip-title">
                متجر <span>قطع غيار السيارات</span>
            </p>

            <p class="top-strip-subtitle">
                الجودة والثقة وأفضل القطع لسيارتك
            </p>

        </div>

    </div>


    <!-- الهيدر الرئيسي -->

    <div class="header-main">

        <!-- علامة البرجر للجوال -->

        <button
            class="menu-toggle"
            type="button"
            id="mobileMenuToggle"
            aria-label="فتح قائمة التنقل"
            aria-controls="mobileSidebar"
            aria-expanded="false">

            <span class="burger-lines">
                <span></span>
                <span></span>
                <span></span>
            </span>

        </button>


        <!-- اسم المتجر -->

        <a href="index.html#home" class="store-logo">
            🚗 متجر <span>قطع غيار السيارات</span>
        </a>


        <!-- البحث -->

        <form class="header-search" id="searchForm">

            <input
                type="search"
                id="searchInput"
                placeholder="ابحث عن قطعة الغيار..."
                aria-label="البحث عن المنتجات">

            <button type="submit">
                بحث
            </button>

        </form>


        <!-- المنتجات والسلة -->

        <div class="header-actions">

            <a href="index.html#products" class="products-link">
                المنتجات
            </a>

            <a href="index.html#cart">
                🛒 السلة
                <span class="cart-number" id="cartCount">0</span>
            </a>

        </div>

    </div>


    <!-- قائمة الكمبيوتر -->

    <nav class="nav-menu" aria-label="القائمة الرئيسية">

        <a href="index.html#home">الرئيسية</a>
        <a href="index.html#categories">الأقسام</a>
        <a href="index.html#products">قطع الغيار</a>
        <a href="index.html#offers">العروض</a>
        <a href="index.html#about">من نحن</a>
        <a href="contact.html" class="contact-link">اتصل بنا</a>

    </nav>


    <!-- خلفية سوداء عند فتح القائمة -->

    <div
        class="mobile-overlay"
        id="mobileOverlay"
        aria-hidden="true">
    </div>


    <!-- القائمة الجانبية للجوال -->

    <aside
        class="mobile-sidebar"
        id="mobileSidebar"
        aria-label="قائمة الجوال"
        aria-hidden="true"
        inert>

        <div class="sidebar-header">

            <div class="sidebar-title">
                🚗 متجر <span>قطع الغيار</span>
            </div>

            <button
                class="sidebar-close"
                type="button"
                id="mobileMenuClose"
                aria-label="إغلاق القائمة">
                &times;
            </button>

        </div>


        <!-- روابط القائمة -->

        <nav class="mobile-nav" aria-label="روابط الجوال">

            <a href="index.html#home">
                الرئيسية
            </a>

            <a href="index.html#categories">
                الأقسام
            </a>

            <a href="index.html#products">
                قطع الغيار
            </a>

            <a href="index.html#offers">
                العروض
            </a>

            <a href="index.html#about">
                من نحن
            </a>

            <a href="contact.html">
                اتصل بنا
            </a>

            <a href="index.html#cart">
                🛒 سلة التسوق
            </a>

        </nav>


        <!-- الجزء السفلي للقائمة -->

        <div class="sidebar-bottom">

            <p>
                الجودة والثقة وأفضل القطع لسيارتك
            </p>

        </div>

    </aside>

</header>

<!-- JavaScript -->
<!-- ====================================== -->

<script>
(function () {

    "use strict";

    const header = document.getElementById("siteHeader");

    if (!header) return;

    const toggle = header.querySelector("#mobileMenuToggle");
    const sidebar = header.querySelector("#mobileSidebar");
    const overlay = header.querySelector("#mobileOverlay");
    const closeBtn = header.querySelector("#mobileMenuClose");
    const searchForm = header.querySelector("#searchForm");
    const searchInput = header.querySelector("#searchInput");
    const mobileLinks = sidebar.querySelectorAll("a");

    let previousFocus = null;


    /* فتح القائمة الجانبية */

    function openMobileMenu() {

        previousFocus = document.activeElement;

        sidebar.removeAttribute("inert");

        sidebar.classList.add("open");
        overlay.classList.add("show");
        toggle.classList.add("active");

        sidebar.setAttribute("aria-hidden", "false");

        toggle.setAttribute("aria-expanded", "true");
        toggle.setAttribute("aria-label", "إغلاق القائمة");

        document.body.style.overflow = "hidden";

        closeBtn.focus();

    }


    /* إغلاق القائمة الجانبية */

    function closeMobileMenu() {

        sidebar.classList.remove("open");
        overlay.classList.remove("show");
        toggle.classList.remove("active");

        toggle.setAttribute("aria-expanded", "false");
        toggle.setAttribute("aria-label", "فتح قائمة التنقل");

        if (previousFocus &&
            typeof previousFocus.focus === "function") {
            previousFocus.focus();
        } else {
            toggle.focus();
        }

        sidebar.setAttribute("aria-hidden", "true");
        sidebar.setAttribute("inert", "");

        document.body.style.overflow = "";

    }


    /* زر الثلاث شرطات */

    toggle.addEventListener("click", function () {

        if (sidebar.classList.contains("open")) {
            closeMobileMenu();
        } else {
            openMobileMenu();
        }

    });


    /* زر الإغلاق */

    closeBtn.addEventListener("click", closeMobileMenu);


    /* الضغط خارج القائمة */

    overlay.addEventListener("click", closeMobileMenu);


    /* إغلاق القائمة عند اختيار رابط */

    mobileLinks.forEach(function (link) {

        link.addEventListener("click", closeMobileMenu);

    });


    /* إغلاق القائمة بمفتاح Escape */

    document.addEventListener("keydown", function (event) {

        if (!sidebar.classList.contains("open")) return;

        if (event.key === "Escape") {
            closeMobileMenu();
        }

        if (event.key === "Tab") {

            const focusable = Array.from(
                sidebar.querySelectorAll(
                    'a[href], button:not([disabled])'
                )
            );

            const first = focusable[0];
            const last = focusable[focusable.length - 1];

            if (event.shiftKey &&
                document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (
                !event.shiftKey &&
                document.activeElement === last
            ) {
                event.preventDefault();
                first.focus();
            }
        }

    });


    /* إغلاق القائمة عند التحول لوضع الكمبيوتر */

    const desktopQuery =
        window.matchMedia("(min-width: 901px)");

    function handleScreenChange(event) {

        if (event.matches &&
            sidebar.classList.contains("open")) {
            closeMobileMenu();
        }

    }

    desktopQuery.addEventListener(
        "change",
        handleScreenChange
    );


    /* البحث - متوافق مع index.html */

    searchForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const query = searchInput.value.trim();

        if (!document.getElementById("productGrid")) {
            window.location.href = "index.html?search=" + encodeURIComponent(query) + "#products";
            return;
        }

        document.dispatchEvent(
            new CustomEvent("store-search", {
                detail: {
                    query: query
                }
            })
        );

        const products = document.getElementById("products");

        if (products) {
            products.scrollIntoView({
                behavior: "smooth"
            });
        }

    });

})();
</script>
